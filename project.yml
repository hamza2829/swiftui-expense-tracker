# XcodeGen spec. CI runs `xcodegen generate` to create ExpenseTracker.xcodeproj,
# so the Xcode project file is never edited by hand or committed.
name: ExpenseTracker

options:
  bundleIdPrefix: com.hamza2829
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - ExpenseTracker
    info:
      path: ExpenseTracker/Info.plist
      properties:
        CFBundleDisplayName: Expenses
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Allows plain http:// to the local mock server (localhost only).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamza2829.ExpenseTracker
    scheme:
      testTargets:
        - ExpenseTrackerTests
        - ExpenseTrackerUITests

  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ExpenseTrackerTests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  ExpenseTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ExpenseTrackerUITests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
