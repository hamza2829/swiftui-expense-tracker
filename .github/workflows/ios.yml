name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project from project.yml
        run: xcodegen generate

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available
          UDID=$(python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            | tee xcodebuild.log

      - name: Start the mock backend
        if: always()
        run: |
          nohup python3 mock-server/server.py > mock-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://localhost:3000/transactions | head -c 300

      - name: Launch the app and take a screenshot
        if: always()
        run: |
          mkdir -p screenshots
          xcrun simctl status_bar booted override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/ExpenseTracker.app
          xcrun simctl launch booted com.hamza2829.ExpenseTracker
          sleep 10
          xcrun simctl io booted screenshot screenshots/expense-tracker.png

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
            mock-server.log

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshots/expense-tracker.png

